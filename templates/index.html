<!DOCTYPE html>
<html>
<head>
    <title>House Price Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

        <div class="main-container">

        <div class="logo-section">
            <h2>Bangalore Price</h2>
            <p>Smart House Prediction</p>
        </div>
<div class="container">
    <h1>House Price Prediction</h1>

    <form method="POST">

        <input type="text" name="location" placeholder="Enter Location" required>

        <input type="number" name="size" placeholder="BHK" required>

        <input type="number" name="total_sqft" placeholder="Total Sqft" required>

        <input type="number" name="bath" placeholder="Bathrooms" required>

        <input type="number" name="balcony" placeholder="Balcony" required>

        <button type="submit">Predict Price</button>

    </form>

    {% if prediction %}
        <div class="result">
            Predicted Price: ₹ {{ prediction }} Lakhs
        </div>
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}
</div>

</body>
</html>
